<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" role="img" aria-label="Auto deportivo tuneado con las letras RM en la puerta" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <filter id="brillo" x="-20%" y="-100%" width="140%" height="300%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="rueda">
      <circle r="39" fill="#151515"/>
      <circle r="30" fill="none" stroke="#df7c0b" stroke-width="3"/>
      <circle r="26" fill="#d9d9d9"/>
      <g stroke="#3b3b3b" stroke-width="6" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-23"/>
        <line x1="0" y1="0" x2="0" y2="-23" transform="rotate(72)"/>
        <line x1="0" y1="0" x2="0" y2="-23" transform="rotate(144)"/>
        <line x1="0" y1="0" x2="0" y2="-23" transform="rotate(216)"/>
        <line x1="0" y1="0" x2="0" y2="-23" transform="rotate(288)"/>
      </g>
      <circle r="6" fill="#df7c0b"/>
    </g>
  </defs>

  <!-- sombra y luces neón bajo el auto -->
  <ellipse cx="320" cy="250" rx="270" ry="9" fill="rgba(0,0,0,0.35)"/>
  <ellipse cx="320" cy="236" rx="255" ry="12" fill="#18e0ff" opacity="0.8" filter="url(#brillo)"/>

  <!-- escape -->
  <rect x="34" y="200" width="18" height="7" rx="3" fill="#8a8a8a"/>

  <!-- alerón -->
  <g>
    <line x1="72" y1="172" x2="72" y2="150" stroke="#2b2b2b" stroke-width="5"/>
    <line x1="104" y1="172" x2="104" y2="150" stroke="#2b2b2b" stroke-width="5"/>
    <rect x="38" y="142" width="92" height="9" rx="3" fill="#df7c0b"/>
  </g>

  <!-- carrocería (negra) -->
  <path d="M52 208 L52 186 Q52 173 72 169 L156 162 L206 114 Q218 102 240 102 L372 102 Q394 102 410 116 L452 160 L548 170 Q590 176 592 194 L592 208 Z" fill="#161616"/>
  <!-- brillo del capó y techo -->
  <path d="M240 102 L372 102 Q394 102 410 116 L420 126 L200 126 L206 114 Q218 102 240 102 Z" fill="#262626"/>

  <!-- ventanas polarizadas -->
  <path d="M224 120 L190 160 L300 160 L300 112 L242 112 Q230 112 224 120 Z" fill="#17384f"/>
  <path d="M314 112 L314 160 L440 160 L404 124 Q397 112 384 112 Z" fill="#17384f"/>
  <path d="M236 116 L208 148 L226 148 L252 116 Z" fill="#ffffff" opacity="0.15"/>

  <!-- puerta -->
  <path d="M308 162 L308 204" stroke="#3a3a3a" stroke-width="3" fill="none"/>
  <path d="M446 164 L446 204" stroke="#3a3a3a" stroke-width="3" fill="none"/>
  <rect x="320" y="170" width="22" height="5" rx="2" fill="#555"/>

  <!-- franja naranja -->
  <path d="M60 202 L584 202" stroke="#df7c0b" stroke-width="5" fill="none"/>

  <!-- letras RM en la puerta -->
  <text x="382" y="194" text-anchor="middle" font-family="'Arial Black', Arial, Helvetica, sans-serif" font-weight="900" font-size="30" fill="#ffffff" stroke="#df7c0b" stroke-width="1.5">RM</text>

  <!-- luces -->
  <rect x="560" y="174" width="32" height="10" rx="4" fill="#ffe58a"/>
  <rect x="52" y="174" width="12" height="10" rx="3" fill="#ff3b3b"/>

  <!-- huecos de las ruedas y ruedas -->
  <circle cx="158" cy="208" r="45" fill="#0a0a0a"/>
  <circle cx="486" cy="208" r="45" fill="#0a0a0a"/>
  <use href="#rueda" transform="translate(158 208)"/>
  <use href="#rueda" transform="translate(486 208)"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
